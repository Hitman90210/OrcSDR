name: User guide

on:
  pull_request:
    paths:
      - '**/*.md'
      - docs/help_media/**
      - mkdocs.yml
      - tools/requirements-docs.txt
      - tools/validate-help-docs.py
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - docs/help_media/**
      - mkdocs.yml
      - tools/requirements-docs.txt
      - tools/validate-help-docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-docs.txt
      - run: pip install -r tools/requirements-docs.txt
      - run: python tools/help_media.py validate
      - run: python tools/validate-help-docs.py
      - run: mkdocs build --strict
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
