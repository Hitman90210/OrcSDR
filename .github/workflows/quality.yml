name: Repository quality

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.ps1'
      # Source hygiene reads the C/C++ and docs tree too, so a NUL byte or a
      # BOM introduced there has to be able to trigger this workflow.
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.md'
      - '**/*.html'
      - '**/*.json'
      - '**/*.yml'
      - tools/release/hosted-c6-release.json
      - .github/workflows/quality.yml
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.ps1'
      # Source hygiene reads the C/C++ and docs tree too, so a NUL byte or a
      # BOM introduced there has to be able to trigger this workflow.
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.md'
      - '**/*.html'
      - '**/*.json'
      - '**/*.yml'
      - tools/release/hosted-c6-release.json
      - .github/workflows/quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install 'cryptography>=45,<47'
      - run: python tools/test_lora_serial_transfer.py
      - run: python tools/test_release_metadata.py
      - run: python tools/test_source_hygiene.py
      - run: python tools/validate-help-docs.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { $failures += "$($_.FullName): $($errors.Message -join '; ')" }
          }
          if ($failures) { throw ($failures -join "`n") }
      - name: Test guarded installer plans
        shell: pwsh
        run: ./tools/release/test-installer-dry-run.ps1
      - name: Test serial authentication helpers
        shell: pwsh
        run: ./tools/release/test-tab5-serial-auth.ps1
