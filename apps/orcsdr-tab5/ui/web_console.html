<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no">
<title>OrcSDR Mission Control</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070c;color:#e8eef4;
font-family:Roboto,Arial,Helvetica,sans-serif}
body{background:radial-gradient(1200px 700px at 50% -10%,#0b1a28 0%,#04070c 55%)}
#app{position:absolute;inset:2.4vh 2.8vw;display:flex;flex-direction:column;gap:1.2vh}
#bar{display:flex;align-items:center;height:7.2vh;padding:0 1.2vw;border:1px solid rgba(0,188,255,.28);
background:rgba(0,10,18,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;gap:.7vw;min-width:22vw}
.brand img{width:5.2vh;height:5.2vh;border-radius:8px}
.word{font-size:2.4vh;font-weight:700;letter-spacing:.12em;color:#6bff00}
.sub{font-size:1.35vh;color:#7ad7ff;letter-spacing:.18em;margin-top:.15vh}
.modepill{margin:0 auto;font-size:2vh;letter-spacing:.28em;color:#e8eef4}
.stats{display:flex;gap:1.4vw;align-items:center;font-size:1.45vh;letter-spacing:.12em}
.dot{width:.85vh;height:.85vh;border-radius:50%;background:#5a6a72;display:inline-block;margin-right:.4vw}
.dot.ok{background:#6bff00;box-shadow:0 0 8px #6bff00}
.dot.warn{background:#ff9a2e}
.dot.bad{background:#ff3b3b}
.clk{color:#7ad7ff;font-variant-numeric:tabular-nums}
#hero{display:grid;grid-template-columns:1.4fr .9fr;gap:1.2vw;height:20vh}
.panel{border:1px solid rgba(0,188,255,.22);background:rgba(0,12,20,.62);
box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.freqbox{padding:1.2vh 1.6vw}
.k{font-size:1.3vh;letter-spacing:.22em;color:#7ad7ff}
.freq{font-size:9.4vh;line-height:.9;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;
color:#f4f8fb;text-shadow:0 0 24px rgba(0,188,255,.18)}
.unit{font-size:2.4vh;color:#6bff00;margin-left:.4vw}
.meta{margin-top:.6vh;font-size:1.6vh;color:#9eb3c0;letter-spacing:.14em}
.meta b{color:#6bff00;font-weight:600}
.sigbox{padding:1.2vh 1.4vw;display:flex;flex-direction:column;justify-content:space-between}
.sigv{font-size:5.2vh;font-weight:700;font-variant-numeric:tabular-nums}
.sigv.ok{color:#6bff00}.sigv.mid{color:#ff9a2e}.sigv.low{color:#8a96a0}
.meter{height:1.5vh;background:#0a1218;border:1px solid rgba(0,188,255,.2);position:relative;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#124,#2ad,#6bff00)}
.hist{height:5.4vh;width:100%}
#viz{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7vh}
.scope{flex:1;min-height:0;position:relative}
.scope canvas{position:absolute;inset:0;width:100%;height:100%}
.axis{position:absolute;left:1vw;right:1vw;bottom:.4vh;display:flex;justify-content:space-between;
font-size:1.25vh;color:#6d8494;letter-spacing:.08em;pointer-events:none}
.reticle{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(107,255,0,.55);pointer-events:none}
.reticle b{position:absolute;left:50%;top:.4vh;transform:translateX(-50%);font-size:1.2vh;color:#6bff00;letter-spacing:.16em}
#foot{height:8.2vh;display:grid;grid-template-columns:1.2fr .7fr .7fr .8fr .9fr auto;gap:.8vw;align-items:stretch}
/* ---- ADS-B radar: shown only while ADS-B is the band, or while targets are
   still being tracked. Range and bearing come from the device; this page never
   receives coordinates. ---------------------------------------------------- */
#radarp{flex:1.1;min-height:0;display:flex;gap:.8vw}
#radarwrap{flex:1.1}
#radarlist{flex:1;min-height:0;padding:.8vh 1vw;overflow:hidden;display:flex;flex-direction:column}
#radartable{width:100%;border-collapse:collapse;font-size:1.35vh;font-variant-numeric:tabular-nums}
#radartable td{padding:.25vh .4vw;color:#cfe0ec;white-space:nowrap}
#radartable td.id{color:#6bff00;font-weight:600}
#radartable td.dim{color:#7d8c98}
#radarnote{margin-top:auto;color:#ff9a2e}
/* This page has no generic .hide rule: #stale.hide only sets opacity. */
#radarp.hide{display:none}
.cell{padding:.8vh 1vw;min-width:0}
.cell .v{font-size:2.1vh;margin-top:.35vh;color:#e8eef4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tvsound{border:1px solid #00bcff;background:#041018;color:#7ad7ff;font-size:1.7vh;letter-spacing:.16em;min-width:12vw}
#tvsound.on{border-color:#6bff00;color:#6bff00;background:#062010}
#tvsound:focus{outline:2px solid #fff}
audio{display:none}
#boot,#stale{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:rgba(4,7,12,.88);z-index:5;transition:opacity .4s}
#boot.gone,#stale.hide{opacity:0;pointer-events:none}
#boot .t{font-size:5vh;letter-spacing:.28em;color:#6bff00}
#boot .s,#stale .s{margin-top:2vh;color:#7ad7ff;letter-spacing:.2em;font-size:1.8vh}
#stale .t{font-size:3.2vh;letter-spacing:.2em;color:#ff9a2e}
</style>
</head>
<body>
<div id="boot"><div class="t">ORCSDR</div><div class="s" id="bootmsg">CONNECTING TO RECEIVER</div></div>
<div id="stale" class="hide"><div class="t">DATA STALE</div><div class="s">RECONNECTING TO TAB5</div></div>
<div id="app">
  <div id="bar">
    <div class="brand">
      <img src="/badge.png" alt="">
      <div><div class="word">ORCSDR</div><div class="sub">LIVE RECEIVER CONSOLE</div></div>
    </div>
    <div class="modepill" id="modepill">—</div>
    <div class="stats">
      <span><i class="dot" id="d_tab5"></i>TAB5 <span id="tab5s">—</span></span>
      <span><i class="dot" id="d_sdr"></i>SDR <span id="sdrs">—</span></span>
      <span id="lat">— ms</span>
      <span class="clk" id="clock">--:--:--</span>
    </div>
  </div>
  <div id="hero">
    <div class="panel freqbox">
      <div class="k">CENTER FREQUENCY</div>
      <div><span class="freq" id="freq">—</span><span class="unit" id="unit">MHz</span></div>
      <div class="meta" id="fmeta">—</div>
    </div>
    <div class="panel sigbox">
      <div class="k">SIGNAL</div>
      <div class="sigv" id="sigv">—</div>
      <div class="meter"><i id="sigbar"></i></div>
      <canvas id="hist" class="hist"></canvas>
    </div>
  </div>
  <div id="viz">
    <div class="panel scope" id="specwrap">
      <canvas id="spec"></canvas>
      <div class="reticle"><b>TUNED</b></div>
      <div class="axis" id="specaxis"></div>
    </div>
    <div class="panel scope" id="fallwrap" style="flex:1.15">
      <canvas id="fall"></canvas>
    </div>
  </div>
  <div id="radarp" class="hide">
    <div class="panel scope" id="radarwrap">
      <canvas id="radar"></canvas>
    </div>
    <div class="panel" id="radarlist">
      <div class="k">AIRCRAFT · <span id="radarcount">0</span> TRACKED · <span id="radarrange">25</span> NM</div>
      <table id="radartable"><tbody></tbody></table>
      <div class="k" id="radarnote"></div>
    </div>
  </div>
  <div id="foot">
    <div class="panel cell"><div class="k">NOW RECEIVING</div><div class="v" id="now">—</div></div>
    <div class="panel cell"><div class="k">AUDIO</div><div class="v" id="aud">—</div></div>
    <div class="panel cell"><div class="k">USB / SPS</div><div class="v" id="usb">—</div></div>
    <div class="panel cell"><div class="k">NETWORK</div><div class="v" id="net">—</div></div>
    <div class="panel cell"><div class="k">POWER</div><div class="v" id="pwr">—</div></div>
    <button id="tvsound" aria-pressed="false">LISTEN HERE · OFF</button>
  </div>
</div>
<script src="/web_audio.js"></script>
<script>
var S={freq:0,sig:-90,left:-90,right:-90,span:960000,mode:'',recv:false,rtl:false,usb:false,wifi:false,
sound:true,stereo:false,rdsC:false,rdsL:false,rec:false,vol:0,bw:0,sps:0,batt:-1,ip:'',clk:'',fresh:0,rtt:0,
air:{active:false,messages:0,rate:0,range:25,tracked:0,located:false,targets:[]}};
var D={freq:0,sig:-90,left:-90,right:-90}, bins=new Float32Array(64), peak=new Float32Array(64);
var hist=[], lastArrow=0,lastAct=0,lastSound=0,audioOn=false,linked=false,fallBuf=null,specBusy=false;
var audioContext=null,audioConnection=null,audioAttempt=0;
function $(id){return document.getElementById(id)}
function lerp(a,b,t){return a+(b-a)*t}
function modeName(m){
  m=(m||'').toLowerCase();
  if(m==='fm') return 'FM BROADCAST';
  if(m==='p25') return 'P25';
  if(m==='adsb') return 'ADS-B';
  if(m==='am'||m==='shortwave') return 'SHORTWAVE';
  if(m==='wx'||m==='weather') return 'WEATHER';
  if(m==='air'||m==='airband') return 'AIRBAND';
  if(m==='lora') return 'LORA';
  if(m==='cb') return 'CB';
  return (m||'STANDBY').toUpperCase();
}
function mhz(hz){
  if(!hz) return '—';
  if(hz>=1000000) return (hz/1000000).toFixed(3);
  return (hz/1000).toFixed(1);
}
function axisHz(off){
  var c=D.freq||S.freq, sp=S.span||960000, hz=c+(off-0.5)*sp;
  return hz>=1e6?(hz/1e6).toFixed(2)+' MHz':(hz/1e3).toFixed(0)+' kHz';
}
function sizeCan(c, host){
  var r=Math.min(2, window.devicePixelRatio||1), w=host.clientWidth, h=host.clientHeight;
  if(w<8||h<8) return;
  if(c.width!==Math.floor(w*r)||c.height!==Math.floor(h*r)){ c.width=Math.floor(w*r); c.height=Math.floor(h*r); }
}
function pal(v){
  var n=Math.max(0,Math.min(1,v));
  if(n<.2) return [4,8,14, 20+n*80];
  if(n<.45){ var t=(n-.2)/.25; return [8+t*10, 30+t*70, 50+t*150, 255]; }
  if(n<.75){ var t=(n-.45)/.3; return [20+t*40, 120+t*90, 200+t*40, 255]; }
  var t=(n-.75)/.25; return [70+t*185, 210+t*45, 240-t*80, 255];
}
function paintSpec(){
  var c=$('spec'), host=$('specwrap'); sizeCan(c,host);
  var g=c.getContext('2d'), w=c.width, h=c.height, n=bins.length;
  g.fillStyle='#03070b'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(0,188,255,.12)'; g.lineWidth=1; g.beginPath();
  for(var i=1;i<5;i++){ g.moveTo(0,i*h/5); g.lineTo(w,i*h/5); g.moveTo(i*w/5,0); g.lineTo(i*w/5,h);} g.stroke();
  g.beginPath();
  for(var i=0;i<n;i++){
    var x=i*(w-2)/(n-1), y=h-6-(peak[i])*(h-14);
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.strokeStyle='rgba(0,188,255,.35)'; g.stroke();
  g.beginPath();
  for(var i=0;i<n;i++){
    var x=i*(w-2)/(n-1), y=h-6-(bins[i])*(h-14);
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.strokeStyle='#6bff00'; g.lineWidth=2; g.stroke();
  var grd=g.createLinearGradient(0,0,0,h);
  grd.addColorStop(0,'rgba(0,188,255,.18)'); grd.addColorStop(1,'rgba(0,188,255,0)');
  g.lineTo(w,h); g.lineTo(0,h); g.closePath(); g.fillStyle=grd; g.fill();
}
function paintFall(){
  var c=$('fall'), host=$('fallwrap'); sizeCan(c,host);
  var g=c.getContext('2d'), w=c.width, h=c.height;
  if(!fallBuf || fallBuf.width!==w || fallBuf.height!==h){
    fallBuf=g.createImageData(w,h);
    for(var i=3;i<fallBuf.data.length;i+=4) fallBuf.data[i]=255;
  }
  fallBuf.data.copyWithin(0, w*4);
  var row=(h-1)*w*4, n=bins.length;
  for(var x=0;x<w;x++){
    var v=bins[Math.min(n-1, Math.floor(x*n/w))];
    var p=pal(v), o=row+x*4;
    fallBuf.data[o]=p[0]; fallBuf.data[o+1]=p[1]; fallBuf.data[o+2]=p[2]; fallBuf.data[o+3]=255;
  }
  g.putImageData(fallBuf,0,0);
  g.strokeStyle='rgba(107,255,0,.45)'; g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2,h); g.stroke();
}
function paintHist(){
  var c=$('hist'); sizeCan(c,c.parentNode);
  var g=c.getContext('2d'), w=c.width, h=c.height;
  g.clearRect(0,0,w,h);
  if(hist.length<2) return;
  g.strokeStyle='#00bcff'; g.lineWidth=2; g.beginPath();
  for(var i=0;i<hist.length;i++){
    var x=i*(w-2)/Math.max(1,hist.length-1);
    var y=h-4-((hist[i]+90)/70)*(h-8);
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.stroke();
}
function applyUi(){
  $('freq').textContent=mhz(D.freq);
  $('unit').textContent=(D.freq||S.freq)>=1e6?'MHz':'kHz';
  $('modepill').textContent=modeName(S.mode);
  var bw=S.bw?Math.round(S.bw/1000)+' kHz':'BW —';
  var flags=[];
  if(S.mode.toLowerCase()==='fm'){
    flags.push(S.stereo?'STEREO':'MONO');
    if(S.rdsL) flags.push('RDS LOCK');
    else if(S.rdsC) flags.push('RDS CARRIER');
  }
  if(S.rec) flags.push('REC');
  $('fmeta').innerHTML=modeName(S.mode)+'  ·  '+bw+(flags.length?'  ·  <b>'+flags.join(' · ')+'</b>':'');
  var sig=D.sig;
  $('sigv').textContent=(typeof sig==='number')?sig.toFixed(1)+' dBFS':'—';
  $('sigv').className='sigv '+(sig>-25?'ok':sig>-45?'mid':'low');
  $('sigbar').style.width=Math.max(0,Math.min(100,(sig+90)/70*100))+'%';
  var live=S.recv&&S.rtl&&(Date.now()-S.fresh<2500);
  $('d_tab5').className='dot '+(S.wifi?'ok':'bad');
  $('tab5s').textContent=S.wifi?(S.ip||'LIVE'):'OFFLINE';
  $('d_sdr').className='dot '+(S.rtl?(S.recv?'ok':'warn'):'bad');
  $('sdrs').textContent=S.rtl?(S.recv?'STREAMING':'READY'):'OFFLINE';
  $('lat').textContent=S.rtt?S.rtt+' ms':'— ms';
  $('clock').textContent=S.clk||'--:--:--';
  $('now').textContent=live?(modeName(S.mode)+'  '+mhz(D.freq)+' '+$('unit').textContent):'STANDBY';
  var aud=S.sound?(S.vol+'/100'):'MUTE';
  if(S.mode.toLowerCase()==='fm' && S.left>-80) aud+='  L '+S.left.toFixed(0)+'  R '+S.right.toFixed(0);
  $('aud').textContent=aud;
  $('usb').textContent=(S.usb?'V4 LINK':'NO USB')+'  '+(S.sps?(S.sps/1e6).toFixed(3)+' MSPS':'—');
  $('net').textContent=(S.ip||'NO LAN')+(S.rtt?'  '+S.rtt+' ms':'');
  $('pwr').textContent=S.batt>=0?(S.batt+'%  BATT'):'—';
  var ax='';
  for(var i=0;i<5;i++) ax+='<span>'+axisHz(i/4)+'</span>';
  $('specaxis').innerHTML=ax;
  var stale=linked && Date.now()-S.fresh>3500;
  $('stale').className=stale?'':'hide';
  if(S.wifi&&S.rtl){ linked=true; $('boot').className='gone'; $('bootmsg').textContent='TELEMETRY LINK ESTABLISHED'; }
}
function tick(){
  var t0=Date.now();
  var x=new XMLHttpRequest();
  x.onreadystatechange=function(){
    if(x.readyState===4){
      S.rtt=Date.now()-t0;
      if(x.status===200){
        try{
          var j=JSON.parse(x.responseText);
          S.freq=j.frequency_hz||0; S.sig=typeof j.signal_dbfs==='number'?j.signal_dbfs:-90;
          S.left=typeof j.left_dbfs==='number'?j.left_dbfs:-90;
          S.right=typeof j.right_dbfs==='number'?j.right_dbfs:-90;
          S.span=j.span_hz||960000; S.mode=j.mode||''; S.recv=!!j.receiving; S.rtl=!!j.rtl_ready;
          S.usb=!!j.usb_connected; S.wifi=!!j.wifi_connected; S.sound=!!j.sound_enabled;
          S.stereo=!!j.stereo; S.rdsC=!!j.rds_carrier; S.rdsL=!!j.rds_locked; S.rec=!!j.recording;
          S.vol=j.volume||0; S.bw=j.filter_bandwidth_hz||0; S.sps=j.effective_sps||0;
          S.batt=j.battery_percent; S.ip=j.wifi_ip||''; S.clk=j.clock||''; S.fresh=Date.now();
          if(j.adsb){
            S.air.active=!!j.adsb.active; S.air.messages=j.adsb.messages||0;
            S.air.rate=j.adsb.rate||0; S.air.range=j.adsb.range_nm||25;
            S.air.tracked=j.adsb.tracked||0; S.air.located=!!j.adsb.located;
            S.air.targets=j.adsb.targets||[];
          }
          hist.push(S.sig); if(hist.length>120) hist.shift();
          if(j.spectrum && j.spectrum.length){
            for(var i=0;i<64;i++){
              var v=(j.spectrum[i]||0)/255;
              bins[i]=bins[i]*.55+v*.45;
              peak[i]=Math.max(peak[i]*0.97, bins[i]);
            }
          }
        }catch(e){}
      }
    }
  };
  x.open('GET','/api/status',true); x.send();
}
function pollSpectrum(){
  if(specBusy) return;
  specBusy=true;
  var x=new XMLHttpRequest();
  x.timeout=2000;
  x.responseType='arraybuffer';
  x.onloadend=function(){ specBusy=false; };
  x.onreadystatechange=function(){
    if(x.readyState!==4) return;
    if(x.status!==200||!x.response) return;
    var data=new Uint8Array(x.response);
    for(var i=0;i<Math.min(64,data.length);i++){
      var v=data[i]/255;
      bins[i]=bins[i]*.55+v*.45;
      peak[i]=Math.max(peak[i]*.97,bins[i]);
    }
  };
  x.open('GET','/api/spectrum',true); x.send();
}
/* ---- ADS-B radar ----------------------------------------------------------
   The device sends range and bearing, never coordinates, so plotting a target
   costs one sine and one cosine. A target with pos:false has no usable
   position -- either it has not sent one yet, or the receiver has no location
   configured -- so it is listed but not plotted, rather than drawn at the
   centre, which is what a missing position used to look like. */
function paintRadar(){
  var show=S.air.active||S.air.targets.length>0;
  var panel=$('radarp');
  if(!panel) return;
  panel.className=show?'':'hide';
  if(!show) return;
  var c=$('radar'), g=c.getContext('2d');
  var d=window.devicePixelRatio||1, r=c.getBoundingClientRect();
  if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){
    c.width=Math.round(r.width*d); c.height=Math.round(r.height*d);
  }
  var w=c.width, h=c.height, cx=w/2, cy=h/2, rad=Math.min(w,h)*0.46;
  var range=S.air.range||25;
  g.clearRect(0,0,w,h);
  g.strokeStyle='rgba(0,188,255,.22)'; g.lineWidth=1;
  for(var i=1;i<=4;i++){ g.beginPath(); g.arc(cx,cy,rad*i/4,0,Math.PI*2); g.stroke(); }
  g.beginPath(); g.moveTo(cx,cy-rad); g.lineTo(cx,cy+rad);
  g.moveTo(cx-rad,cy); g.lineTo(cx+rad,cy); g.stroke();
  g.font=(11*d)+'px Roboto,Arial'; g.fillStyle='#7ad7ff';
  g.fillText('N',cx+3*d,cy-rad+11*d);
  var list=S.air.targets, plotted=0;
  for(var k=0;k<list.length;k++){
    var t=list[k];
    if(!t.pos) continue;
    var rr=Math.min((t.rng||0)/range,1)*rad, a=((t.brg||0)-90)*Math.PI/180;
    var x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    g.fillStyle=(t.age>30)?'#8a96a0':'#6bff00';
    g.beginPath(); g.arc(x,y,3*d,0,Math.PI*2); g.fill();
    if(t.hdg_ok){
      var ha=((t.hdg||0)-90)*Math.PI/180;
      g.strokeStyle=g.fillStyle; g.beginPath(); g.moveTo(x,y);
      g.lineTo(x+Math.cos(ha)*10*d,y+Math.sin(ha)*10*d); g.stroke();
    }
    g.fillStyle='#cfe0ec';
    g.fillText(String(t.id||''),x+6*d,y-5*d);
    plotted++;
  }
  $('radarcount').textContent=S.air.tracked||list.length;
  $('radarrange').textContent=Math.round(range);
  $('radarnote').textContent=!S.air.located
    ? 'NO RECEIVER LOCATION · TARGETS LISTED, NOT PLOTTED'
    : (plotted===0&&list.length ? 'NO POSITION FIX YET' : '');
  /* Built as text nodes: a label arrives from the air and is never markup. */
  var body=$('radartable').getElementsByTagName('tbody')[0];
  while(body.firstChild) body.removeChild(body.firstChild);
  for(var m=0;m<list.length&&m<10;m++){
    var a2=list[m];
    /* Zero is legal for every one of these -- level flight, a stopped
       aircraft, due north, sea level -- so the *_ok flag decides, not the
       value's truthiness. */
    var cells=[
      [String(a2.id||''),'id'],
      [a2.pos?(a2.rng||0).toFixed(1)+' NM':'—',''],
      [a2.alt_ok?(Math.round(a2.alt/100)*100).toLocaleString()+' ft':'—',''],
      [a2.spd_ok?a2.spd+' kt':'—',''],
      [a2.hdg_ok?a2.hdg+'°':'—',''],
      [a2.vr_ok?(a2.vr>64?'↑':(a2.vr<-64?'↓':'→')):'—','dim']
    ];
    var tr=document.createElement('tr');
    for(var n=0;n<cells.length;n++){
      var td=document.createElement('td');
      if(cells[n][1]) td.className=cells[n][1];
      td.appendChild(document.createTextNode(cells[n][0]));
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
}
var lastFall=0,lastUi=0;
function frame(){
  D.freq=D.freq?lerp(D.freq,S.freq,.18):S.freq;
  D.sig=lerp(D.sig,S.sig,.16);
  D.left=lerp(D.left,S.left,.16);
  D.right=lerp(D.right,S.right,.16);
  paintSpec();
  paintRadar();
  var now=Date.now();
  if(now-lastFall>90){ lastFall=now; paintFall(); }
  if(now-lastUi>100){ lastUi=now; applyUi(); paintHist(); }
  requestAnimationFrame(frame);
}
function setSoundUi(state){
  var b=$('tvsound');
  if(state==='error') audioOn=false;
  b.textContent='LISTEN HERE · '+state.toUpperCase();
  b.className=state==='live'?'on':'';
  b.setAttribute('aria-pressed',audioOn?'true':'false');
}
function startTvSound(){
  audioOn=true;
  var attempt=++audioAttempt;
  setSoundUi('connecting');
  try {
    if(!audioContext) {
      var Context=window.AudioContext||window.webkitAudioContext;
      audioContext=new Context();
      audioConnection=new OrcAudio.Connection(audioContext,setSoundUi);
    }
    audioContext.resume().then(function(){
      if(!audioOn||attempt!==audioAttempt) return;
      if(audioContext.state!=='running'){ setSoundUi('error'); return; }
      audioConnection.start((location.protocol==='https:'?'wss://':'ws://')+location.host+'/api/audio/stream');
    }).catch(function(){ if(attempt===audioAttempt) setSoundUi('error'); });
  } catch(e) { setSoundUi('error'); }
}
function stopTvSound(){
  audioOn=false;
  ++audioAttempt;
  if(audioConnection) audioConnection.stop();
  setSoundUi('off');
}
function toggleTvSound(){
  var now=Date.now();
  if(now-lastSound<700) return;
  lastSound=now;
  if(audioOn) stopTvSound(); else startTvSound();
}
function fromArrow(){ return Date.now()-lastArrow<400; }
$('tvsound').addEventListener('click',function(e){
  if(fromArrow()){ e.preventDefault(); return; }
  toggleTvSound();
});
document.addEventListener('keydown',function(e){
  var code=e.keyCode||e.which;
  if(code===37||code===38||code===39||code===40||code===19||code===20||code===21||code===22||
     e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    lastArrow=Date.now(); return;
  }
  if(e.key==='Enter'||code===13||code===23){
    lastArrow=Date.now();
    if(document.activeElement===$('tvsound')){ toggleTvSound(); e.preventDefault(); }
  }
});
window.addEventListener('pagehide',stopTvSound);
setTimeout(function(){ if(!linked) $('bootmsg').textContent='SEARCHING FOR TAB5'; },2500);
tick(); pollSpectrum(); setInterval(tick,1000); setInterval(pollSpectrum,250); requestAnimationFrame(frame);
</script>
